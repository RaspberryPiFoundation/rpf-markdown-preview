name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-vsix-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-and-attach-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build extension
        run: yarn run compile

      - name: Lint (non-blocking)
        continue-on-error: true
        run: yarn run lint

      - name: Test (non-blocking)
        continue-on-error: true
        run: yarn run test

      - name: Package VSIX
        run: npx @vscode/vsce package --yarn

      - name: Upload VSIX to triggering release
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
