name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

concurrency:
  group: release-vsix-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-and-attach-vsix:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack and activate Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-yarn --allow-missing-repository --skip-license

      - name: Upload VSIX to triggering release
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
