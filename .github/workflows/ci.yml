name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack and activate Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn run compile

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          if-no-files-found: error
          path: |
            out
            media

  lint:
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack and activate Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn run lint

  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack and activate Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache VS Code for WDIO
        uses: actions/cache@v4
        with:
          path: .wdio-vscode-service
          key: ${{ runner.os }}-wdio-vscode-${{ hashFiles('yarn.lock', 'wdio.conf.ts', 'package.json') }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: extension-build
          path: .

      - name: Test
        run: yarn run wdio
